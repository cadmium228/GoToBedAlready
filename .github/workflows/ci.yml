name: Verify and package

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.9"
          cache: false
      - run: go test -race -cover ./...
      - run: go vet ./...
      - run: node --check web/app.js
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal)"
  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.9"
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: python scripts/build.py --version v0.1.0
      - uses: actions/upload-artifact@v7
        with:
          name: GoToBedAlready-windows
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
