name: Verify and package

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, for example v0.2.0
        default: v0.2.0
        required: true
        type: string
      publish:
        description: Publish the verified Windows builds as a prerelease
        default: false
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.9"
          cache: false
      - name: Prepare WebView2 SDK
        if: runner.os == 'Windows'
        run: python scripts/fetch_webview.py
      - name: Test with diagnostics
        shell: bash
        run: |
          if go test -race -cover ./... > test-output.txt 2>&1; then
            cat test-output.txt
          else
            cat test-output.txt
            while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done < test-output.txt
            exit 1
          fi
      - run: go vet ./...
      - run: node --check web/app.js
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal)"
  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.9"
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Build Windows archives
        env:
          VERSION: ${{ inputs.version || 'v0.2.0-preview' }}
        run: python scripts/build.py --version "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: GoToBedAlready-windows
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish &&
      github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: GoToBedAlready-windows
          path: dist
      - name: Publish the prerelease without overwriting existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid release version: $VERSION" >&2; exit 1 ;;
          esac
          if gh release view "$VERSION" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "$VERSION" dist/*.zip dist/SHA256SUMS.txt \
            --repo "$GH_REPO" \
            --target "$GITHUB_SHA" \
            --title "GoToBedAlready $VERSION — Windows Preview" \
            --prerelease \
            --notes-file docs/release-notes.md
