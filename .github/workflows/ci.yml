name: Verify and package

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the existing v0.1.0 draft after verification
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.9"
          cache: false
      - name: Test with diagnostics
        shell: bash
        run: |
          if go test -race -cover ./... > test-output.txt 2>&1; then
            cat test-output.txt
          else
            cat test-output.txt
            while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done < test-output.txt
            exit 1
          fi
      - run: go vet ./...
      - run: node --check web/app.js
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal)"
  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.9"
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: python scripts/build.py --version v0.1.0
      - uses: actions/upload-artifact@v7
        with:
          name: GoToBedAlready-windows
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publish) ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/arena/676301c3-gotobedalready' &&
       github.event.head_commit.message == 'Release GoToBedAlready v0.1.0')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: GoToBedAlready-windows
          path: dist
      - name: Upload verified packages and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload v0.1.0 dist/*.zip dist/SHA256SUMS.txt --clobber
          gh release edit v0.1.0 --draft=false --prerelease --target "$GITHUB_SHA"
