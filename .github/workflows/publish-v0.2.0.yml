name: Publish v0.2.0

on:
  push:
    branches: ["arena/cb4fbe2d-gotobedalready"]
    paths: [".github/workflows/publish-v0.2.0.yml"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.9"
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Build the Windows archives from main
        run: python scripts/build.py --version v0.2.0
      - name: Create the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v0.2.0 --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release v0.2.0 already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create v0.2.0 dist/*.zip dist/SHA256SUMS.txt \
            --repo "$GH_REPO" \
            --target "$(git rev-parse HEAD)" \
            --title "GoToBedAlready v0.2.0 — Windows Preview" \
            --prerelease \
            --notes-file docs/release-notes.md
