<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>GoToBedAlready</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <svg
          class="app-icon"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path d="M12 3v8M6.3 5.8a8 8 0 1 0 11.4 0" />
        </svg>
        <span>GoToBedAlready</span>
        <span id="preview-label" hidden>Предпросмотр</span>
      </header>
      <h1>Выключить после загрузки</h1>
      <form id="setup-form">
        <label class="label" id="process-label">Процесс</label>
        <button
          type="button"
          id="choose-process"
          class="process-picker"
          aria-labelledby="process-label selected-name"
          aria-haspopup="dialog"
        >
          <span class="process-copy"
            ><strong id="selected-name">Выбрать процесс</strong
            ><small id="selected-detail" hidden></small
          ></span>
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="m6 8 4 4 4-4" />
          </svg>
        </button>
        <div class="delay-row">
          <label for="delay">Задержка перед выключением</label>
          <div class="number-input">
            <button type="button" id="minus" aria-label="Уменьшить задержку">
              −</button
            ><input
              id="delay"
              type="number"
              min="1"
              max="180"
              step="1"
              value="5"
              required
              inputmode="numeric"
              aria-label="Задержка в минутах"
            /><span>мин</span
            ><button type="button" id="plus" aria-label="Увеличить задержку">
              +
            </button>
          </div>
        </div>
        <div class="power-settings">
          <label class="option-row" for="blank-display"
            ><span
              ><strong>Гасить экран</strong
              ><small
                >При наблюдении. После ввода — через 10 секунд.</small
              ></span
            ><input type="checkbox" id="blank-display" /><span
              class="switch"
              aria-hidden="true"
            ></span
          ></label>
          <label class="option-row" for="prevent-sleep"
            ><span
              ><strong>Отключить таймауты</strong
              ><small
                >Не усыплять ПК и не гасить экран автоматически.</small
              ></span
            ><input type="checkbox" id="prevent-sleep" checked /><span
              class="switch"
              aria-hidden="true"
            ></span
          ></label>
        </div>
        <section
          id="progress-section"
          class="progress-section"
          aria-label="Прогресс загрузки"
          hidden
        >
          <div class="progress-heading">
            <span id="progress-caption">Загрузка</span
            ><output id="progress-value">—</output>
          </div>
          <progress
            id="progress-bar"
            max="100"
            aria-label="Прогресс загрузки"
          ></progress>
        </section>
        <p id="observation-warning" class="notice" role="status" hidden></p>
        <p id="error" class="notice error" role="alert" hidden></p>
        <p id="power-warning" class="notice error" role="status" hidden></p>
        <button class="primary-button" id="start" type="submit" disabled>
          Начать
        </button>
        <button class="stop-button" id="cancel" type="button" hidden>
          Остановить
        </button>
        <button class="diagnostic-button" type="button" id="diagnostics" hidden>
          Сохранить диагностику
        </button>
      </form>
    </main>
    <dialog id="process-dialog" aria-labelledby="process-dialog-title">
      <div class="dialog-heading">
        <h2 id="process-dialog-title">Выбрать процесс</h2>
        <button
          class="close-button"
          id="close-dialog"
          type="button"
          aria-label="Закрыть"
        >
          ×
        </button>
      </div>
      <label class="visually-hidden" for="process-search"
        >Поиск по названию, PID или окну</label
      ><input
        id="process-search"
        type="search"
        placeholder="Название, PID или окно"
        autocomplete="off"
      />
      <div id="process-list" class="process-list" aria-live="polite"></div>
      <button class="quiet-button" id="refresh-processes" type="button">
        Обновить список
      </button>
    </dialog>
    <dialog id="confirm-dialog" aria-labelledby="confirm-title">
      <h2 id="confirm-title">Начать наблюдение?</h2>
      <p id="confirm-copy"></p>
      <p>Сохраните открытые документы.</p>
      <div class="dialog-actions">
        <button class="quiet-button" id="confirm-back" type="button">
          Назад</button
        ><button class="primary-button" id="confirm-start" type="button">
          Начать
        </button>
      </div>
    </dialog>
    <dialog id="diagnostic-dialog" aria-labelledby="diagnostic-title">
      <h2 id="diagnostic-title">Диагностика прогресса</h2>
      <p>
        JSON-файл содержит заголовки окон и доступные элементы выбранного
        процесса и его дочерних процессов. Проверьте текст перед отправкой.
      </p>
      <div class="dialog-actions">
        <button class="quiet-button" id="diagnostic-back" type="button">
          Назад</button
        ><button class="primary-button" id="diagnostic-save" type="button">
          Сохранить
        </button>
      </div>
    </dialog>
  </body>
</html>
